name: Set up
description: >-
  Node from .nvmrc, and node_modules restored from the cache (npm ci only
  when package-lock.json or .nvmrc changed).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - id: modules
      uses: actions/cache@v4
      with:
        # Workspaces keep a few nested node_modules of their own.
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
