name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No secrets: the build only needs env that passes the apps' env schemas
# (apps/*/lib/env.server.ts). Nothing here is real.
env:
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  DISABLE_POSTHOG_UPLOAD_SOURCEMAPS: 'true'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  NEXT_PUBLIC_POSTHOG_KEY: placeholder
  NEXT_PUBLIC_POSTHOG_HOST: http://localhost:8000
  RESEND_API_KEY: placeholder
  RESEND_FROM_EMAIL: dev@example.test
  RESEND_REPLY_TO_EMAIL: dev@example.test
  AI_GATEWAY_API_KEY: placeholder
  GOOGLE_CLIENT_ID: placeholder
  GOOGLE_CLIENT_SECRET: placeholder
  GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/callback/google
  CLIENT_PORTAL_URL: http://localhost:3001
  INTERNAL_PORTAL_URL: http://localhost:3000
  APP_BASE_URL: http://localhost:3000
  GITHUB_APP_ID: placeholder
  GITHUB_APP_PRIVATE_KEY: placeholder
  GITHUB_APP_WEBHOOK_SECRET: placeholder
  GITHUB_APP_CLIENT_ID: placeholder
  GITHUB_APP_CLIENT_SECRET: placeholder
  STRIPE_SECRET_KEY: sk_test_placeholder
  # 32 bytes of 0x01, base64: a well-formed key that encrypts nothing real.
  OAUTH_TOKEN_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
  # Turborepo's remote cache, shared by every job and run. Optional: until
  # the TURBO_TOKEN secret and TURBO_TEAM variable exist, each job keeps a
  # local cache (restored below) instead.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

# Three jobs side by side, each restoring node_modules instead of installing.
# Turborepo skips a workspace whose files haven't changed since a cached run.
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            .turbo/cache
            .cache/prettier
          key: lint-${{ github.sha }}
          restore-keys: lint-
      - run: npm run format:check
      - run: npm run lint

  types:
    name: Type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: types-${{ github.sha }}
          restore-keys: types-
      - run: npm run type-check
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The types job type-checks; Next skips its own second pass.
      CI_SKIP_BUILD_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Next's build cache: an unchanged module isn't compiled again.
      - uses: actions/cache@v4
        with:
          path: apps/*/.next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
